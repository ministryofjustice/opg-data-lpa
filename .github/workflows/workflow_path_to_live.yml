name: "[Workflow] Path to Live"

concurrency:
  group: ${{ github.workflow }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

defaults:
 run:
  shell: bash

jobs:
  branch_name:
    name: "Generate a safe branch name"
    uses: ministryofjustice/opg-github-workflows/.github/workflows/data-parse-branch-name.yml@54c2ae52e1361f11d2623a3627bdf2c5ca2c3f0c # v3.19.18

  set_variables:
    name: output workflow variables
    runs-on: ubuntu-latest
    outputs:
      semver_tag: ${{ steps.semver_tag.outputs.tag }}
      commit_sha: ${{ steps.commit_sha.outputs.sha }}
    steps:
      - name: checkout the project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: "0"
      - name: Set terraform version - environment
        id: terraform_version_environment
        uses: ministryofjustice/opg-github-actions/actions/terraform-version@ae37b9b322286123971417e82b665e56e9d6aa3f # v4.10.3
        with:
          terraform_directory: "./terraform/environment"
      - name: "Semver tag"
        id: semver_tag
        uses: ministryofjustice/opg-github-actions/actions/semver@ae37b9b322286123971417e82b665e56e9d6aa3f # v4.10.3
        with:
          prerelease: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        id: commit_sha
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  terraform_lint:
    name: Lint & Validate Terraform
    uses: ./.github/workflows/_terraform_lint.yml
    with:
      oidc_role: ${{ vars.OIDC_MAIN_ROLE }}
    secrets:
      allowlist_deploy_key: ${{ secrets.SSH_PRIVATE_KEY_ALLOW_LIST_REPOSITORY }}
      github_access_token: ${{ secrets.GITHUB_TOKEN }}

  python_unit_tests:
    name: Python Unit Tests
    needs:
      - branch_name
      - set_variables
    uses: ./.github/workflows/_python_unit_tests.yml
    with:
      branch_name: ${{ needs.branch_name.outputs.branch_name }}
      commit_sha: ${{ needs.set_variables.outputs.commit_sha }}
      semver_tag: ${{ needs.set_variables.outputs.semver_tag }}
    secrets:
      pact_broker_password: ${{ secrets.PACT_BROKER_PASSWORD }}

  docker_build_scan_push:
    name: Build, Scan and Push
    needs:
      - branch_name
      - python_unit_tests
      - set_variables
    uses: ./.github/workflows/_docker_build_scan_push.yml
    with:
      branch_name: ${{ needs.branch_name.outputs.safe }}
      semver_tag: ${{ needs.set_variables.outputs.semver_tag }}
    secrets: inherit # pragma: allowlist secret

  terraform_development_account_apply:
    name: "Terraform Apply Development Account Terraform"
    needs:
      - branch_name
      - docker_build_scan_push
      - set_variables
      - terraform_lint
    uses: ./.github/workflows/_terraform.yml
    with:
      apply: true
      workspace_name: development
      level: 'account'
      oidc_role: ${{ vars.OIDC_MAIN_ROLE }}
      default_role: ${{ vars.DEVELOPMENT_ROLE }}
      management_role: ${{ vars.MANAGEMENT_ROLE }}
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}

  terraform_development_environment_apply:
    name: "Terraform Apply Development Environment"
    needs:
      - branch_name
      - docker_build_scan_push
      - set_variables
      - terraform_development_account_apply
    uses: ./.github/workflows/_terraform.yml
    with:
      apply: true
      workspace_name: development
      level: environment
      load_ssh_key: true
      oidc_role: ${{ vars.OIDC_MAIN_ROLE }}
      default_role: ${{ vars.DEVELOPMENT_ROLE }}
      management_role: ${{ vars.MANAGEMENT_ROLE }}
      lambda_image_tag: ${{ needs.branch_name.outputs.branch_name }}-${{ needs.set_variables.outputs.semver_tag }}
    secrets:
      allowlist_deploy_key: ${{ secrets.SSH_PRIVATE_KEY_ALLOW_LIST_REPOSITORY }}
      github_access_token: ${{ secrets.GITHUB_TOKEN }}

  integration_test_development:
    name: Run Integration Tests on Development Environment
    needs: terraform_development_environment_apply
    uses: ./.github/workflows/_integration_tests.yml
    with:
      data_lpa_api_url: "https://dev.lpa.api.opg.service.justice.gov.uk/v1"
      oidc_role: ${{ vars.OIDC_DEVELOPMENT_TEST_RUNNER_ROLE }}
      working_directory: "./integration_tests"
      tests_directory: "./integration_tests/v1"

  terraform_preprod_account_apply:
    name: "Terraform Apply Preproduction Account"
    needs:
      - branch_name
      - set_variables
      - docker_build_scan_push
      - integration_test_development
    uses: ./.github/workflows/_terraform.yml
    with:
      apply: true
      workspace_name: preproduction
      level: account
      oidc_role: ${{ vars.OIDC_MAIN_ROLE }}
      default_role: ${{ vars.PREPRODUCTION_MAIN_ROLE }}
      management_role: ${{ vars.MANAGEMENT_ROLE }}
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}

  terraform_preprod_environment_apply:
    name: "Terraform Apply Preproduction"
    needs:
      - branch_name
      - set_variables
      - docker_build_scan_push
      - terraform_preprod_account_apply
    uses: ./.github/workflows/_terraform.yml
    with:
      apply: true
      workspace_name: preproduction
      level: environment
      load_ssh_key: true
      oidc_role: ${{ vars.OIDC_MAIN_ROLE }}
      default_role: ${{ vars.PREPRODUCTION_MAIN_ROLE }}
      management_role: ${{ vars.MANAGEMENT_ROLE }}
      lambda_image_tag: ${{ needs.branch_name.outputs.branch_name }}-${{ needs.set_variables.outputs.semver_tag }}
    secrets:
      allowlist_deploy_key: ${{ secrets.SSH_PRIVATE_KEY_ALLOW_LIST_REPOSITORY }}
      github_access_token: ${{ secrets.GITHUB_TOKEN }}

  smoke_test_preprod:
    name: Smoke Test Preproduction
    needs: terraform_preprod_environment_apply
    uses: ./.github/workflows/_integration_tests.yml
    with:
      data_lpa_api_url: "https://pre.lpa.api.opg.service.justice.gov.uk/v1"
      oidc_role: ${{ vars.OIDC_PREPRODUCTION_TEST_RUNNER_ROLE }}
      working_directory: "./integration_tests"
      tests_directory: "./integration_tests/v1"
      specific_tests: "./v1/test_healthcheck.py"

  terraform_prod_account_apply:
    name: "Terraform Apply Production Account"
    needs:
      - branch_name
      - set_variables
      - docker_build_scan_push
      - smoke_test_preprod
    uses: ./.github/workflows/_terraform.yml
    with:
      apply: true
      workspace_name: production
      level: account
      oidc_role: ${{ vars.OIDC_MAIN_ROLE }}
      default_role: ${{ vars.PRODUCTION_MAIN_ROLE }}
      management_role: ${{ vars.MANAGEMENT_ROLE }}
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}

  terraform_prod_environment_apply:
    name: "Terraform Apply Production Environment"
    needs:
      - branch_name
      - set_variables
      - docker_build_scan_push
      - terraform_prod_account_apply
    uses: ./.github/workflows/_terraform.yml
    with:
      apply: true
      workspace_name: production
      level: environment
      load_ssh_key: true
      oidc_role: ${{ vars.OIDC_MAIN_ROLE }}
      default_role: ${{ vars.PRODUCTION_MAIN_ROLE }}
      management_role: ${{ vars.MANAGEMENT_ROLE }}
      lambda_image_tag: ${{ needs.branch_name.outputs.branch_name }}-${{ needs.set_variables.outputs.semver_tag }}
    secrets:
      allowlist_deploy_key: ${{ secrets.SSH_PRIVATE_KEY_ALLOW_LIST_REPOSITORY }}
      github_access_token: ${{ secrets.GITHUB_TOKEN }}

  terraform_integration_environment_apply:
    name: "Terraform Apply Integration Environment"
    needs:
      - branch_name
      - set_variables
      - docker_build_scan_push
      - terraform_prod_environment_apply
    uses: ./.github/workflows/_terraform.yml
    with:
      apply: true
      workspace_name: integration
      level: environment
      load_ssh_key: true
      oidc_role: ${{ vars.OIDC_MAIN_ROLE }}
      default_role: ${{ vars.DEVELOPMENT_ROLE }}
      management_role: ${{ vars.MANAGEMENT_ROLE }}
      lambda_image_tag: ${{ needs.branch_name.outputs.branch_name }}-${{ needs.set_variables.outputs.semver_tag }}
    secrets:
      allowlist_deploy_key: ${{ secrets.SSH_PRIVATE_KEY_ALLOW_LIST_REPOSITORY }}
      github_access_token: ${{ secrets.GITHUB_TOKEN }}

  terraform_demo_environment_apply:
    name: "Terraform Apply Demo Environment"
    needs:
      - branch_name
      - set_variables
      - docker_build_scan_push
      - terraform_prod_environment_apply
    uses: ./.github/workflows/_terraform.yml
    with:
      apply: true
      workspace_name: demo
      level: environment
      load_ssh_key: true
      oidc_role: ${{ vars.OIDC_MAIN_ROLE }}
      default_role: ${{ vars.DEVELOPMENT_ROLE }}
      management_role: ${{ vars.MANAGEMENT_ROLE }}
      lambda_image_tag: ${{ needs.branch_name.outputs.branch_name }}-${{ needs.set_variables.outputs.semver_tag }}
    secrets:
      allowlist_deploy_key: ${{ secrets.SSH_PRIVATE_KEY_ALLOW_LIST_REPOSITORY }}
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
